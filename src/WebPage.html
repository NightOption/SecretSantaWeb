<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secret Santa Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
          margin: 0;
          padding: 0;
          font-family: "MS Sans Serif", Arial, sans-serif;
          background: linear-gradient(135deg, #2b133a, #4b006e, #ff77c0);
          color: #000;
          display: flex;
          justify-content: center;
          align-items: flex-start;
          min-height: 100vh;
        }

        .window {
          margin-top: 40px;
          width: 380px;
          background: #c0c0c0;
          border: 2px solid #000;
          box-shadow: 4px 4px 0 #000;
        }

        .title-bar {
          background: linear-gradient(90deg, #000080, #1084d0);
          color: #fff;
          padding: 4px 8px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-size: 12px;
          font-weight: bold;
        }

        .title-bar-buttons {
          display: flex;
          gap: 2px;
        }

        .title-bar-button {
          width: 14px;
          height: 14px;
          border: 1px solid #000;
          background: #c0c0c0;
          display: inline-block;
          text-align: center;
          font-size: 10px;
          line-height: 12px;
          box-shadow: 1px 1px 0 #fff;
        }

        .window-body {
          padding: 10px;
          border-top: 2px solid #fff;
          border-left: 2px solid #fff;
          border-right: 2px solid #808080;
          border-bottom: 2px solid #808080;
          background: #e0e0e0;
          font-size: 12px;
        }

        h1 {
          font-size: 14px;
          margin: 0 0 8px;
        }

        .description {
          font-size: 11px;
          margin-bottom: 10px;
        }

        .participants {
          max-height: 200px;
          overflow-y: auto;
          margin-bottom: 8px;
          border: 2px inset #808080;
          padding: 6px;
          background: #fff;
        }

        .participant-row {
          display: flex;
          gap: 4px;
          margin-bottom: 4px;
        }

        .participant-row input {
          flex: 1;
          padding: 2px 4px;
          border: 2px inset #808080;
          font-size: 11px;
          font-family: inherit;
        }

        .participant-row button {
          padding: 0 6px;
          border: 2px outset #fff;
          background: #c0c0c0;
          font-size: 11px;
          cursor: pointer;
        }

        .actions {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-top: 8px;
        }

        .btn {
          padding: 3px 12px;
          border: 2px outset #fff;
          background: #c0c0c0;
          cursor: pointer;
          font-size: 12px;
        }

        .btn:active {
          border-style: inset;
        }

        .status {
          margin-top: 8px;
          font-size: 11px;
          min-height: 16px;
        }

        .status.error {
          color: #b00000;
        }

        .status.success {
          color: #006400;
        }

        .footer-note {
          margin-top: 6px;
          font-size: 10px;
          text-align: right;
          opacity: 0.8;
        }

        @media (max-width: 480px) {
          .window {
            width: 95%;
          }
        }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span>SECRET_SANTA.EXE</span>
        <div class="title-bar-buttons">
            <span class="title-bar-button">−</span>
            <span class="title-bar-button">□</span>
            <span class="title-bar-button">×</span>
        </div>
    </div>
    <div class="window-body">
        <h1>Secret Santa Generator</h1>
        <p class="description">
            Add everyone’s <b>name</b> and <b>email</b>.
            We’ll shuffle them and send each person their Secret Santa.
        </p>

        <div id="participants" class="participants"></div>

        <div class="actions">
            <button class="btn" id="addParticipantBtn">Add person</button>
            <button class="btn" id="generateBtn">Generate &amp; send</button>
        </div>

        <div id="status" class="status"></div>
        <div class="footer-note">Powered by vibes &amp; Java.</div>
    </div>
</div>

<script>
    const participantsContainer = document.getElementById('participants');
    const addParticipantBtn = document.getElementById('addParticipantBtn');
    const generateBtn = document.getElementById('generateBtn');
    const statusEl = document.getElementById('status');

    function createParticipantRow(name = '', email = '') {
      const row = document.createElement('div');
      row.className = 'participant-row';

      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.placeholder = 'Name';
      nameInput.value = name;

      const emailInput = document.createElement('input');
      emailInput.type = 'email';
      emailInput.placeholder = 'Email';
      emailInput.value = email;

      const removeBtn = document.createElement('button');
      removeBtn.textContent = 'X';
      removeBtn.title = 'Remove';
      removeBtn.onclick = () => row.remove();

      row.appendChild(nameInput);
      row.appendChild(emailInput);
      row.appendChild(removeBtn);

      return row;
    }

    function addParticipantRow() {
      participantsContainer.appendChild(createParticipantRow());
    }

    addParticipantBtn.addEventListener('click', addParticipantRow);

    // Start with 3 rows by default
    for (let i = 0; i < 3; i++) addParticipantRow();

    generateBtn.addEventListener('click', async () => {
      statusEl.textContent = '';
      statusEl.className = 'status';

      const rows = document.querySelectorAll('.participant-row');
      const participants = [];

      rows.forEach(row => {
        const inputs = row.querySelectorAll('input');
        const name = inputs[0].value.trim();
        const email = inputs[1].value.trim();
        if (name && email) {
          participants.push({ name, email });
        }
      });

      if (participants.length < 2) {
        statusEl.textContent = 'Need at least 2 participants.';
        statusEl.classList.add('error');
        return;
      }

      try {
        generateBtn.disabled = true;
        generateBtn.textContent = 'Sending...';

        const response = await fetch('/api/secret-santa', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ participants })
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || 'Server error');
        }

        statusEl.textContent = 'Emails sent! Check your inboxes 🎁';
        statusEl.classList.add('success');
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
        statusEl.classList.add('error');
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate & send';
      }
    });
</script>

</body>
</html>
